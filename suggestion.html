<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지원단에 바란다 - 시민활동통합지원단</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="suggestion">

<div id="site-header-mount"></div>

<section class="page-hero">
  <div class="wrap">
    <div class="crumb">소식·참여</div>
    <h1>지원단에 바란다</h1>
  </div>
</section>

<section class="content">
  <div class="wrap" style="max-width:820px;">

    <div class="panel" style="margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;">
      <p style="margin:0; font-size:13px; color:var(--sub);">
        시민활동통합지원단 운영이나 사업에 대한 의견·건의·문의를 남겨주세요. 담당자가 확인 후 답변드립니다.<br>
        비공개로 남기시면 담당자만 내용을 확인하며, 공개로 남기시면 다른 방문자도 질문과 답변을 볼 수 있습니다.
      </p>
      <button type="button" class="btn btn-primary" id="write-toggle" style="flex-shrink:0;">글쓰기</button>
    </div>

    <div id="ok-alert" class="alert alert-ok" style="display:none;"></div>

    <div class="panel" id="write-panel" style="display:none; margin-bottom:20px;">
      <form id="sg-form">
        <div class="form-row">
          <label>이름 <span class="req">*</span></label>
          <input type="text" id="f-name" required placeholder="이름 또는 단체명">
        </div>
        <div class="form-row">
          <label>연락처 <span class="req">*</span></label>
          <input type="tel" id="f-phone" required placeholder="010-0000-0000">
        </div>
        <div class="form-row">
          <label>이메일</label>
          <input type="email" id="f-email" placeholder="답변을 받으실 이메일 (선택)">
        </div>
        <div class="form-row">
          <label>제목 <span class="req">*</span></label>
          <input type="text" id="f-title" required placeholder="문의 제목">
        </div>
        <div class="form-row">
          <label>내용 <span class="req">*</span></label>
          <textarea id="f-content" required placeholder="문의·건의 내용을 적어주세요"></textarea>
        </div>
        <div class="form-row">
          <label>공개 여부</label>
          <div class="radio-group">
            <label><input type="radio" name="f-public" value="private" checked> 비공개 (담당자만 확인)</label>
            <label><input type="radio" name="f-public" value="public"> 공개 (제목·내용·답변이 게시판에 표시됨)</label>
          </div>
        </div>
        <div class="form-row">
          <label>개인정보 동의 <span class="req">*</span></label>
          <label style="font-weight:500; display:flex; gap:8px; align-items:flex-start; padding-top:9px;">
            <input type="checkbox" id="f-agree" required style="margin-top:3px;">
            <span>문의 접수·답변 목적으로 이름·연락처·이메일을 수집하는 것에 동의합니다. (<a href="#" style="text-decoration:underline;">개인정보처리방침</a> 참고)</span>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">등록하기</button>
        </div>
      </form>
    </div>

    <div id="list-view">
      <div class="notice-panel" id="sg-list"></div>
    </div>

    <div id="detail-view" style="display:none;">
      <div class="panel">
        <div class="detail-head">
          <span class="notice-cat" id="d-status"></span>
          <h3 id="d-title" style="margin-top:10px;"></h3>
          <div class="detail-meta">
            <span id="d-name"></span>
            <span id="d-date"></span>
          </div>
        </div>
        <div class="detail-body" id="d-body"></div>
        <div id="d-answer-wrap" style="display:none; margin-top:18px; padding-top:18px; border-top:1px dashed var(--line);">
          <div style="font-size:12px; font-weight:700; color:var(--teal); margin-bottom:6px;">담당자 답변</div>
          <div class="detail-body" id="d-answer"></div>
        </div>
      </div>
      <div class="back-link" onclick="showList()">← 목록으로</div>
    </div>

  </div>
</section>

<div id="site-footer-mount"></div>

<script src="assets/site.js"></script><script>
  let allSuggestions = [];

  function statusPill(item) {
    if (!item.isPublic) return `<span class="notice-cat" style="background:#eef0f4; color:var(--sub);">비공개</span>`;
    return item.answered
      ? `<span class="notice-cat" style="background:var(--teal-bg); color:var(--teal);">답변완료</span>`
      : `<span class="notice-cat">답변대기</span>`;
  }

  function renderList() {
    document.getElementById("sg-list").innerHTML = allSuggestions.map(s => `
      <a class="notice-row" href="javascript:void(0)" onclick="showDetail('${s.id}')">
        ${statusPill(s)}
        <span class="notice-title">${s.title}</span>
        <span class="notice-date">${s.name ? s.name + " · " : ""}${s.date}</span>
      </a>
    `).join("") || `<div class="notice-row"><span class="notice-title">등록된 문의가 없습니다. 첫 문의를 남겨주세요.</span></div>`;
  }

  function showList() {
    history.replaceState(null, "", "suggestion.html");
    document.getElementById("list-view").style.display = "block";
    document.getElementById("detail-view").style.display = "none";
  }

  function showDetail(id) {
    const s = allSuggestions.find(x => String(x.id) === String(id));
    if (!s) return showList();
    document.getElementById("d-status").textContent = s.isPublic ? (s.answered ? "답변완료" : "답변대기") : "비공개";
    document.getElementById("d-title").textContent = s.title;
    document.getElementById("d-name").textContent = s.name || "";
    document.getElementById("d-date").textContent = s.date;

    const answerWrap = document.getElementById("d-answer-wrap");
    if (!s.isPublic) {
      document.getElementById("d-body").textContent = "비공개로 등록된 문의는 담당자만 확인할 수 있습니다. 남겨주신 연락처로 별도 회신드립니다.";
      answerWrap.style.display = "none";
    } else {
      document.getElementById("d-body").textContent = s.content;
      if (s.answered) {
        document.getElementById("d-answer").textContent = s.answer;
        answerWrap.style.display = "block";
      } else {
        answerWrap.style.display = "none";
      }
    }

    document.getElementById("list-view").style.display = "none";
    document.getElementById("detail-view").style.display = "block";
    document.getElementById("write-panel").style.display = "none";
  }

  document.getElementById("write-toggle").addEventListener("click", () => {
    const panel = document.getElementById("write-panel");
    panel.style.display = panel.style.display === "none" ? "block" : "none";
    if (panel.style.display === "block") panel.scrollIntoView({ behavior: "smooth" });
  });

  document.getElementById("sg-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const isPublic = document.querySelector('input[name="f-public"]:checked').value === "public";
    const payload = {
      name: document.getElementById("f-name").value,
      phone: document.getElementById("f-phone").value,
      email: document.getElementById("f-email").value,
      title: document.getElementById("f-title").value,
      content: document.getElementById("f-content").value,
      isPublic,
      submittedAt: new Date().toISOString(),
    };
    const result = await Api.submitSuggestion(payload);
    if (!result.ok) { alert(result.message || "등록하지 못했습니다. 잠시 후 다시 시도해 주세요."); return; }

    allSuggestions.unshift({
      id: "new-" + Date.now(),
      date: new Date().toISOString().slice(0, 10),
      isPublic,
      status: "접수",
      answered: false,
      title: isPublic ? payload.title : "🔒 비공개 문의",
      name: isPublic ? payload.name : "",
      content: payload.content,
      answer: "",
    });
    renderList();

    const alertBox = document.getElementById("ok-alert");
    alertBox.style.display = "block";
    alertBox.textContent = result.message || "등록되었습니다.";
    alertBox.scrollIntoView({ behavior: "smooth" });

    e.target.reset();
    document.getElementById("write-panel").style.display = "none";
  });

  document.addEventListener("DOMContentLoaded", () => {
    mountLayout("suggestion");
    Api.getSuggestions().then(list => {
      allSuggestions = list;
      renderList();

      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      if (id) showDetail(id);
    });
  });
</script>
</body>
</html>
