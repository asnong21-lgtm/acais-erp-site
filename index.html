<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시민활동통합지원단</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home">

<div id="site-header-mount"></div>

<section class="hero">
  <div class="wrap">
    <h1>시민과 함께, 안성의 내일을 만듭니다</h1>
    <p>사무국과 5개 센터가 함께하는 시민활동통합지원단 — 공익활동 · 마을공동체 · 사회적경제 · 도농교류 · 도시재생</p>
    <div class="hero-actions">
      <a href="reservation.html" class="btn btn-primary">공간대관 신청</a>
      <a href="notice.html" class="btn btn-outline">공지사항 보기</a>
    </div>
  </div>
</section>

<section class="block" id="centers">
  <div class="wrap">
    <div class="block-head">
      <h2><span class="dot"></span>센터별안내</h2>
      <span class="more-link">각 센터를 눌러 자세히 보기</span>
    </div>
    <div class="grid-5" id="center-grid"></div>
  </div>
</section>

<section class="block" style="background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);">
  <div class="wrap">
    <div class="block-head">
      <h2><span class="dot"></span>공지사항 · 소식</h2>
      <a href="notice.html" class="more-link">더보기 +</a>
    </div>
    <div class="notice-panel" id="notice-list"></div>
  </div>
</section>

<section class="block" id="intro">
  <div class="wrap">
    <div class="block-head">
      <h2><span class="dot"></span>바로가기</h2>
    </div>
    <div class="quick-grid">
      <div class="quick-card">
        <h3>공간대관</h3>
        <p>대회의실 · 소회의실 · 미디어창작실을 온라인으로 신청하세요.</p>
        <a href="reservation.html" class="btn btn-ghost">신청하기</a>
      </div>
      <div class="quick-card">
        <h3>지원단에 바란다</h3>
        <p>시민 여러분의 의견과 건의사항을 남겨주세요.</p>
        <a href="suggestion.html" class="btn btn-ghost">건의하기</a>
      </div>
      <div class="quick-card">
        <h3>정보공개</h3>
        <p>안성시 위탁 예산 집행 및 정산 현황을 공개합니다.</p>
        <a href="disclosure.html" class="btn btn-ghost">확인하기</a>
      </div>
    </div>
  </div>
</section>

<div id="site-footer-mount"></div>

<script src="assets/site.js"></script><script>
  // Firebase 연동 모듈(있다면)이 window.Api를 먼저 교체할 시간을 주기 위해
  // DOMContentLoaded 시점(모듈 스크립트 실행 이후)에 데이터를 불러온다.
  document.addEventListener("DOMContentLoaded", () => {
    mountLayout("intro");

    const centerGrid = document.getElementById("center-grid");
    centerGrid.innerHTML = MOCK_CENTERS.map(c => `
      <div class="center-card">
        <div class="icon">${c.icon}</div>
        <div class="name">${c.name}</div>
        <div class="desc">${c.desc}</div>
      </div>
    `).join("");

    Api.getNotices().then(list => {
      const noticeList = document.getElementById("notice-list");
      noticeList.innerHTML = list.slice(0, 5).map(n => `
        <a class="notice-row" href="notice.html?id=${n.id}">
          <span class="notice-cat">${n.cat}</span>
          <span class="notice-title">${n.title}</span>
          <span class="notice-date">${n.date}</span>
        </a>
      `).join("");
    });
  });
</script>
</body>
</html>
